<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bricks! - Portal Clássico</title>
    <style>
        body {
            background-color: #000066;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #cccccc;
            color: #000000;
            padding: 20px;
            border-bottom: 4px solid #333333;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background-color: #ffffff;
            color: #000000;
            padding: 25px;
            border: 3px solid #333333;
            box-shadow: 6px 6px 0px #000000;
            text-align: left;
        }
        h2 { margin-top: 0; color: #000066; }
        .btn {
            padding: 12px 25px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
            margin: 5px;
        }
        .btn-play {
            background-color: #00cc00;
            color: white;
            box-shadow: 0px 4px 0px #008000;
        }
        .btn-download {
            background-color: #0066cc;
            color: white;
            box-shadow: 0px 4px 0px #003366;
        }
        .btn-save {
            background-color: #ff9900;
            color: white;
            box-shadow: 0px 4px 0px #cc6600;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .customizer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .color-group {
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .color-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #333;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
        }
        .actions-bar {
            text-align: center;
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BRICKS!</h1>
        <p>A era clássica dos blocos (2006–2016)[cite: 1, 2]</p>
    </header>

    <div class="container">
        <h2>Customizar Avatar</h2>
        <p>Escolha as cores clássicas para o seu personagem antes de entrar no jogo:</p>

        <div class="customizer-grid">
            <div class="color-group">
                <label for="headColor">Cabeça:</label>
                <input type="color" id="headColor" value="#ffff00">
            </div>
            <div class="color-group">
                <label for="torsoColor">Torso:</label>
                <input type="color" id="torsoColor" value="#cc0000">
            </div>
            <div class="color-group">
                <label for="leftArmColor">Braço Esquerdo:</label>
                <input type="color" id="leftArmColor" value="#ffff00">
            </div>
            <div class="color-group">
                <label for="rightArmColor">Braço Direito:</label>
                <input type="color" id="rightArmColor" value="#ffff00">
            </div>
            <div class="color-group">
                <label for="leftLegColor">Perna Esquerda:</label>
                <input type="color" id="leftLegColor" value="#009900">
            </div>
            <div class="color-group">
                <label for="rightLegColor">Perna Direita:</label>
                <input type="color" id="rightLegColor" value="#009900">
            </div>
        </div>

        <div style="text-align: center;">
            <button class="btn btn-save" onclick="salvarCores()">Salvar Cores</button>
        </div>

        <div class="actions-bar">
            <!-- O link de JOGAR agora passa as cores personalizadas via URL schema -->
            <a href="#" id="playButton" class="btn btn-play">JOGAR</a>
            <a href="https://github.com/spore976/Bricks/releases/download/Versions/Bricks_Setup_v1.exe" class="btn btn-download">BAIXAR INSTALADOR</a>
        </div>
    </div>

    <script>
        // Carrega as cores salvas anteriormente no navegador, se houver
        window.onload = function() {
            if(localStorage.getItem('headColor')) document.getElementById('headColor').value = localStorage.getItem('headColor');
            if(localStorage.getItem('torsoColor')) document.getElementById('torsoColor').value = localStorage.getItem('torsoColor');
            if(localStorage.getItem('leftArmColor')) document.getElementById('leftArmColor').value = localStorage.getItem('leftArmColor');
            if(localStorage.getItem('rightArmColor')) document.getElementById('rightArmColor').value = localStorage.getItem('rightArmColor');
            if(localStorage.getItem('leftLegColor')) document.getElementById('leftLegColor').value = localStorage.getItem('leftLegColor');
            if(localStorage.getItem('rightLegColor')) document.getElementById('rightLegColor').value = localStorage.getItem('rightLegColor');
            
            atualizarLinkJogar();
        };

        function salvarCores() {
            localStorage.setItem('headColor', document.getElementById('headColor').value);
            localStorage.setItem('torsoColor', document.getElementById('torsoColor').value);
            localStorage.setItem('leftArmColor', document.getElementById('leftArmColor').value);
            localStorage.setItem('rightArmColor', document.getElementById('rightArmColor').value);
            localStorage.setItem('leftLegColor', document.getElementById('leftLegColor').value);
            localStorage.setItem('rightLegColor', document.getElementById('rightLegColor').value);
            
            atualizarLinkJogar();
            alert("Cores do avatar salvas com sucesso!");
        }

        function atualizarLinkJogar() {
            const h = encodeURIComponent(localStorage.getItem('headColor') || '#ffff00');
            const t = encodeURIComponent(localStorage.getItem('torsoColor') || '#cc0000');
            const la = encodeURIComponent(localStorage.getItem('leftArmColor') || '#ffff00');
            const ra = encodeURIComponent(localStorage.getItem('rightArmColor') || '#ffff00');
            const ll = encodeURIComponent(localStorage.getItem('leftLegColor') || '#009900');
            const rl = encodeURIComponent(localStorage.getItem('rightLegColor') || '#009900');

            // Monta a URL customizada do protocolo enviando os parâmetros de cores
            const urlProtocolo = `bricks://launch?head=${h}&torso=${t}&la=${la}&ra=${ra}&ll=${ll}&rl=${rl}`;
            document.getElementById('playButton').href = urlProtocolo;
        }
    </script>
</body>
</html>
