<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bricks! - Portal Clássico</title>
    <style>
        body {
            background-color: #000066; /* Azul clássico */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #cccccc;
            color: #000000;
            padding: 20px;
            border-bottom: 4px solid #333333;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background-color: #ffffff;
            color: #000000;
            padding: 30px;
            border: 3px solid #333333;
            box-shadow: 6px 6px 0px #000000;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
            margin: 10px;
        }
        .btn-play {
            background-color: #00cc00;
            color: white;
            box-shadow: 0px 4px 0px #008000;
        }
        .btn-download {
            background-color: #0066cc;
            color: white;
            box-shadow: 0px 4px 0px #003366;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>BRICKS!</h1>
        <p>A era clássica dos blocos (2006–2016)</p>
    </header>

    <div class="container">
        <h2>Pronto para jogar o Obby?</h2>
        <p>Se você já tem o jogo instalado, clique em Jogar. Caso contrário, baixe o instalador primeiro!</p>
        
        <!-- Botão para abrir o jogo via protocolo personalizado -->
        <a href="bricks://launch" class="btn btn-play">JOGAR</a>

        <!-- Botão com o link direto da sua Release do GitHub -->
        <a href="https://github.com/spore976/Bricks/releases/download/Versions/Bricks_Setup_v1.exe" class="btn btn-download">BAIXAR INSTALADOR</a>
    </div>

</body>
</html>
